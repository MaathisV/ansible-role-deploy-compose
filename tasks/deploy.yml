- name: Create {{ service.name }} service directory
  ansible.builtin.file:
    path: "{{ services_base_path }}/{{ service.name }}"
    state: directory
    owner: "{{ services_owner }}"
    group: "{{ services_group }}"
    mode: '0755'

- name: Render docker-compose.yml for {{ service.name }}
  template:
    src: "{{ playbook_dir }}/services/{{ service.name }}/docker-compose.yml"
    dest: "{{ services_base_path }}/{{ service.name }}/docker-compose.yml"
    mode: '0644'

- name: Render .env for {{ service.name }}
  ansible.builtin.template:
    src: "{{ playbook_dir }}/services/{{ service.name }}/.env.j2"
    dest: "{{ services_base_path }}/{{ service.name }}/.env"
    mode: '0600'
  when: lookup('ansible.builtin.fileglob', playbook_dir ~ '/services/' ~ service.name ~ '/.env.j2', wantlist=True) | length > 0
  no_log: true

- name: Run pre tasks for {{ service.name }}
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/services/{{ service.name }}/pre_tasks.yml"
  when: lookup('ansible.builtin.fileglob', playbook_dir ~ '/services/' ~ service.name ~ '/pre_tasks.yml', wantlist=True) | length > 0

- name: Deploy {{ service.name }}
  community.docker.docker_compose_v2:
    project_src: "{{ services_base_path }}/{{ service.name }}"
    state: present
    pull: missing
    recreate: auto
    remove_orphans: true

- name: Run post tasks for {{ service.name }}
  ansible.builtin.include_tasks:
    file: "{{ playbook_dir }}/services/{{ service.name }}/post_tasks.yml"
  when: lookup('ansible.builtin.fileglob', playbook_dir ~ '/services/' ~ service.name ~ '/post_tasks.yml', wantlist=True) | length > 0